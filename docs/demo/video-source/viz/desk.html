<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trading_desk live</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="viz.css">
<style>
  #hdr { position: absolute; left: 24px; right: 24px; top: 0; height: 50px; display: flex; align-items: center; gap: 12px; }
  #gid { font-family: var(--mono); font-size: 29px; font-weight: 800; color: var(--gold); letter-spacing: -0.01em; }
  #gsub { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .thread { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 16px; color: var(--muted); }
  .thread .k { font-weight: 600; }
  #tid { font-family: var(--mono); font-size: 16px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; min-width: 352px; text-align: center; white-space: nowrap; }
  #ck { font-family: var(--mono); font-size: 16px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; white-space: nowrap; min-width: 150px; text-align: center; }
  #ck b { color: var(--text); }
  .pill { font-size: 16px; font-weight: 800; letter-spacing: .05em; padding: 7px 14px; border-radius: 999px; background: #1a2338; color: var(--muted); border: 2px solid var(--line); white-space: nowrap; width: 214px; text-align: center; }
  .pill.blue { background: #10304f; color: #bfe0ff; border-color: var(--blue); }
  .pill.green { background: #0f3128; color: #aaf5d6; border-color: var(--green); }
  .pill.red { background: #3a1018; color: #ffb3bb; border-color: var(--red); }
  #strip { position: absolute; left: 24px; right: 24px; top: 54px; height: 70px; display: flex; gap: 6px; }
  .card { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px 15px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; overflow: hidden; transition: border-color .3s, background .3s, outline-color .3s; }
  .card.hi { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ck2 { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .cv { font-size: 21px; line-height: 1.15; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  .cv.dim { color: #4b5873; font-weight: 600; }
  .ct { position: absolute; left: 8px; bottom: -1px; font-family: var(--mono); font-size: 10.5px; color: #1a1304; background: var(--gold); border-radius: 6px 6px 0 0; padding: 0 7px; font-weight: 700; line-height: 1.35; white-space: nowrap; }
  .card.flash { animation: fl 0.9s ease-out; }
  @keyframes fl { 0% { border-color: var(--gold); background: #2a2410; } 100% { border-color: var(--line); background: var(--panel); } }
  #g { position: absolute; left: 24px; top: 130px; width: 1232px; height: 496px; overflow: hidden; border-radius: 14px; background: rgba(15,22,38,.55); border: 1px solid #1e2940; }
  #legend { position: absolute; right: 36px; top: 138px; opacity: .9; }
  #over { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
  .co { animation: coin .5s ease both; }
  @keyframes coin { from { opacity: 0; } to { opacity: 1; } }
  body.nostrip #strip { visibility: hidden; }
</style>
</head>
<body>
  <div id="hdr">
    <span id="gid">trading_desk</span><span id="gsub">LangGraph · live run</span>
    <div class="thread"><span class="k">thread_id</span><span id="tid">…</span><span id="ck"><b>0</b> checkpoints</span></div>
    <div id="status" class="pill grey">CONNECTING</div>
  </div>
  <div id="strip"></div>
  <svg id="g" width="1232" height="496"></svg>
  <div id="legend"></div>
  <div id="over"></div>
  <script type="module" src="desk.js"></script>
</body>
</html>
