[project]
name = "trading-desk-langgraph"
version = "0.1.0"
description = "Multi-agent Trading Desk (Research Proposal, Risk Management, and Desk Head) in LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "langgraph-cli[inmem]>=0.1.70",
    "databento>=0.90.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]
